# HUB75-Display: 3x 64x64 P4 -> 192x64. Renderer: ../perron/perron_render.h (Port der Mockups
# tools/mockup/scenes.py, Iteration 5). Bildschirme:
#   SETUP        – Hotspot aktiv, kein WLAN: QR-Code (WLAN-Beitritt) + Anleitung
#   VERBINDEN    – WLAN gespeichert, (noch) nicht verbunden
#   EINRICHTEN   – im WLAN, aber keine Haltestelle/kein Bahnhof: QR-Code zur Einstellungsseite
#   NORMAL       – Statusleiste | Abfahrten | Infozeile ; Warnungen übernehmen den Bildschirm

font:
  # X11 misc-fixed Bitmapschriften (gemeinfrei), siehe ../fonts/README.md
  - file: "fonts/5x7.bdf"
    id: f_small
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "fonts/6x10.bdf"
    id: f_mid
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "fonts/4x6.bdf"          # kompakte Ziele in der geteilten Zeile
    id: f_tiny
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "fonts/9x15.bdf"         # große Zielnamen (Layout Premium)
    id: f_dest
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "fonts/9x15B.bdf"
    id: f_big
    glyphs: " +-0123456789:'°X"
  - file: "fonts/10x20.bdf"
    id: f_clock
    glyphs: " +-0123456789:'°X"

qr_code:
  # Setup: verbindet das Handy mit dem Hotspot (danach öffnet sich das Captive-Portal).
  # 29 Zeichen -> QR-Version 2 (25x25) -> scale 2 = 50 px + 7 px Rand auf 64 px.
  - id: setup_qr
    value: "WIFI:T:nopass;S:${setup_ssid};;"
    ecc: LOW
  # Link zur Einstellungsseite (http://<IP>/), zur Laufzeit gesetzt (max. 23 Zeichen).
  - id: settings_qr
    value: "http://0.0.0.0/"
    ecc: LOW

display:
  - platform: hub75
    id: matrix
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 64
    layout_cols: 3
    layout_rows: 1
    layout: HORIZONTAL
    brightness: 60
    bit_depth: 6
    # Panel-Refresh und Neuzeichnen entkoppelt (Smoke-Test 18.10.): sonst 40 Hz Flackern
    # (update_interval 1s) bzw. Schwarz-Blitz beim Neuzeichnen (ohne double_buffer).
    update_interval: never
    min_refresh_rate: 100
    double_buffer: true
    lambda: |-
      const auto WHITE = Color(255, 255, 255);
      const auto DIM   = Color(120, 120, 120);
      const auto AMBER = Color(255, 150, 0);
      static const perron::Fonts F{id(f_small), id(f_mid), id(f_big), id(f_clock), id(f_dest), id(f_tiny)};
      it.fill(Color::BLACK);

      auto *wifi = wifi::global_wifi_component;
      const bool connected = wifi->is_connected();

      // ---------- SETUP: Hotspot offen, kein WLAN ----------
      if (!connected && wifi->is_ap_active()) {
        const int scale = 2;
        const int qs = id(setup_qr).get_size() * scale;
        // Heller Grund + Ruhezone. Volles Weiß scannt besser als gedimmt (getestet, ca. 2 m).
        it.filled_rectangle(0, 0, 64, 64, WHITE);
        it.qr_code((64 - qs) / 2, (64 - qs) / 2, id(setup_qr), Color::BLACK, scale);
        const int x = 70;
        perron::txt(it, F, F.mid,   x,  2, "WLAN einrichten", AMBER);
        perron::txt(it, F, F.small, x, 15, "QR-Code scannen", WHITE);
        perron::txt(it, F, F.small, x, 25, "oder WLAN", DIM);
        perron::txt(it, F, F.small, x, 35, "\"${setup_ssid}\" wählen", WHITE);
        perron::txt(it, F, F.small, x, 46, "Seite öffnet nicht?", DIM);
        perron::txt(it, F, F.small, x, 56, "192.168.4.1", WHITE);
        return;
      }

      // ---------- VERBINDEN ----------
      if (!connected) {
        perron::txt(it, F, F.mid, 96, 28, "Verbinde mit WLAN ...", AMBER, 1);
        return;
      }

      // ---------- EINRICHTEN: noch keine Haltestelle / kein Bahnhof ----------
      const bool configured = !id(cfg_stib_points).state.empty() || !id(cfg_train_station).state.empty();
      if (!configured) {
        const std::string ip = id(wifi_ip).has_state() ? id(wifi_ip).state : "";
        static std::string qr_ip;
        if (!ip.empty() && ip != qr_ip) {
          id(settings_qr).set_value("http://" + ip + "/");
          qr_ip = ip;
        }
        if (!qr_ip.empty()) {
          const int scale = 2;
          const int qs = id(settings_qr).get_size() * scale;
          it.filled_rectangle(0, 0, 64, 64, WHITE);
          it.qr_code((64 - qs) / 2, (64 - qs) / 2, id(settings_qr), Color::BLACK, scale);
        }
        const int x = 70;
        perron::txt(it, F, F.mid,   x,  2, "Einrichtung", AMBER);
        perron::txt(it, F, F.small, x, 15, "QR-Code scannen", WHITE);
        perron::txt(it, F, F.small, x, 25, "oder im Browser:", DIM);
        perron::txt(it, F, F.small, x, 35, ip, WHITE);
        perron::txt(it, F, F.small, x, 46, "Haltestelle und", DIM);
        perron::txt(it, F, F.small, x, 56, "Linien wählen", DIM);
        return;
      }

      // ---------- NORMAL ----------
      perron::render(it, F, perron::look(), id(sntp_time).now());

# 20 fps: Infozeilen-Laufschrift, "fährt ein"-Pfeile. Panel-Refresh (100 Hz) läuft per DMA.
interval:
  - interval: 50ms
    then:
      - component.update: matrix

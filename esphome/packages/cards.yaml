# Karten aus Home Assistant: Vorlagen (JSON), freie Fläche (Canvas) und Bilder.
# Spezifikation und Beispiele: docs/cards.md
api:
  actions:
    # Eine Karte als JSON, z.B. {"id":"washer","t":"prog","p":2,"ti":"Waschen","val":"42'","pct":63}
    # {"id":"washer","del":1} löscht sie. Ergebnis: Sensor "Kartenstatus".
    - action: push_json
      variables:
        card: string
      then:
        - lambda: 'perron::card_json(card);'
    # Bild als rohe RGB565-Pixel (little endian), base64, in Teilen von max. 8 KB Rohdaten.
    # seq 0..total-1 nacheinander senden; key = Name des Bildes (max. 3 gleichzeitig).
    - action: push_image
      variables:
        key: string
        seq: int
        total: int
        width: int
        height: int
        data: string
      then:
        - lambda: 'perron::push_image_chunk(key, seq, total, width, height, data);'
    # PNG, JPEG oder BMP per Link (z.B. HA entity_picture / camera_proxy mit Zugriffstoken).
    # JPEG bei camera_proxy, .jpg/.jpeg; BMP bei .bmp; sonst PNG.
    # Pendel-Verbindung (Slot 1/2) auf Abruf ins Vollbild, auch ausserhalb des Zeitfensters
    - action: show_commute
      variables:
        slot: int
        seconds: int
      then:
        - lambda: 'perron::show_commute(slot, seconds);'
    - action: push_image_url
      variables:
        key: string
        url: string
      then:
        - lambda: 'perron::push_image_url(key, url);'

online_image:
  - id: ha_png
    url: "http://127.0.0.1/perron.png"   # Platzhalter; HA setzt die URL zur Laufzeit
    format: PNG
    type: RGB565
    resize: 192x192
    buffer_size: 8192
    on_download_finished:
      - lambda: |-
          auto *img = id(ha_png);
          perron::url_image_store(0, img->get_width(), img->get_height(),
                                  [img](int x, int y) { return img->get_pixel(x, y); });
          img->release();
    on_error:
      - lambda: 'perron::url_image_done(0, false, 0, 0);'
  # JPEG: Kamerabilder aus HA (camera_proxy). Tipp: &width=192 an die URL hängen, dann skaliert
  # HA das Bild vorher und die Datei bleibt klein (JPEG wird komplett im PSRAM dekodiert).
  - id: ha_jpg
    url: "http://127.0.0.1/perron.jpg"
    format: JPEG
    type: RGB565
    resize: 192x192
    buffer_size: 8192
    on_download_finished:
      - lambda: |-
          auto *img = id(ha_jpg);
          perron::url_image_store(2, img->get_width(), img->get_height(),
                                  [img](int x, int y) { return img->get_pixel(x, y); });
          img->release();
    on_error:
      - lambda: 'perron::url_image_done(2, false, 0, 0);'
  - id: ha_bmp
    url: "http://127.0.0.1/perron.bmp"
    format: BMP
    type: RGB565
    resize: 192x192
    buffer_size: 8192
    on_download_finished:
      - lambda: |-
          auto *img = id(ha_bmp);
          perron::url_image_store(1, img->get_width(), img->get_height(),
                                  [img](int x, int y) { return img->get_pixel(x, y); });
          img->release();
    on_error:
      - lambda: 'perron::url_image_done(1, false, 0, 0);'

text_sensor:
  - platform: template
    name: "Kartenstatus"
    icon: mdi:card-text-outline
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      static std::string last;
      if (perron::card_status() == last) return {};
      last = perron::card_status();
      return last;

button:
  - platform: template
    id: btn_card_demo
    name: "Karten-Demo"
    icon: mdi:card-multiple-outline
    entity_category: config
    on_press:
      - lambda: 'perron::card_demo();'

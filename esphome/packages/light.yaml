# Umgebungslicht (Adafruit VEML7700, STEMMA QT) -> automatische Helligkeit.
# Anschluss: STEMMA-QT-Kabel an die I2C-Buchse des MatrixPortal S3 (SDA GPIO16, SCL GPIO17).
# Ohne Sensor läuft alles weiter mit fester Helligkeit ("Helligkeit"/"Helligkeit Nacht").
i2c:
  sda: GPIO16
  scl: GPIO17
  scan: true

sensor:
  - platform: veml7700
    address: 0x10
    update_interval: 5s
    # Frontscheiben-Korrektur passiert zur Laufzeit (Einstellung "Frontscheibe Lichtdurchlass"),
    # damit kein Neu-Flashen nötig ist, wenn die Scheibe montiert/gewechselt wird.
    glass_attenuation_factor: 1.0
    ambient_light:
      id: ambient_lux
      name: "Umgebungslicht"
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1

switch:
  - platform: template
    id: sw_auto_bright
    name: "Automatische Helligkeit"
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  - platform: template
    id: cfg_glass
    name: "Frontscheibe Lichtdurchlass"
    icon: mdi:mirror
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100   # ohne Scheibe; Plexiglas 7C83 = 21
    entity_category: config

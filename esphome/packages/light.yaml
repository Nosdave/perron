# Umgebungslicht (Adafruit VEML7700, STEMMA QT) -> automatische Helligkeit.
# Anschluss: STEMMA-QT-Kabel an die I2C-Buchse des MatrixPortal S3 (SDA GPIO16, SCL GPIO17).
# Ohne Sensor läuft alles weiter mit fester Helligkeit ("Helligkeit"/"Helligkeit Nacht").
i2c:
  sda: GPIO16
  scl: GPIO17
  scan: true

sensor:
  - platform: veml7700
    address: 0x10
    update_interval: 5s
    # Frontscheiben-Korrektur passiert zur Laufzeit (Einstellung "Frontscheibe Lichtdurchlass"),
    # damit kein Neu-Flashen nötig ist, wenn die Scheibe montiert/gewechselt wird.
    glass_attenuation_factor: 1.0
    ambient_light:
      id: ambient_lux
      name: "Umgebungslicht roh"
      internal: true            # intern alle 5 s fuer die Regelung; HA bekommt den gedrosselten Wert unten
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 1
  # fuer Home Assistant: hoechstens alle 30 s und nur bei spuerbarer Aenderung (Recorder schonen)
  - platform: copy
    source_id: ambient_lux
    name: "Helligkeit Umgebung"
    unit_of_measurement: "lx"
    device_class: illuminance
    accuracy_decimals: 1
    filters:
      - or:
          - throttle_with_priority: 300s
          - delta: 15%
      - throttle: 30s
  # was die Tafel gerade einstellt (0-100 %), zum Nachjustieren der Kurve
  - platform: template
    id: applied_brightness
    name: "Helligkeit aktuell"
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return perron::applied_brightness_pct();'
    filters:
      - delta: 2

  # Chip-Temperatur des ESP32-S3 (grob, liegt über der Raumtemperatur) – für Gehäuse/Lüfter-Entscheidung
  - platform: internal_temperature
    name: "Temperatur ESP"
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - delta: 1.0

switch:
  - platform: template
    id: sw_auto_bright
    name: "Helligkeit automatisch"
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  - platform: template
    id: cfg_glass
    name: "Helligkeit Frontscheibe"
    icon: mdi:mirror
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100   # ohne Scheibe; Plexiglas 7C83 = 21
    entity_category: config

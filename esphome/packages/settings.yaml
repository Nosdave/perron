# Einstellungen -> Datenschicht/Renderer übernehmen (alle 2 s; Änderungen lösen Neuabruf aus).
interval:
  - interval: 2s
    then:
      - lambda: |-
          diele::Config c;
          static const char *LANGS[] = {"de", "fr", "nl", "en"};
          auto li = id(cfg_lang).active_index();
          c.lang = LANGS[li.has_value() ? *li : 0];   // STIB falls back to fr/nl itself
          c.stib_key = std::string(id(g_stib_key).data());
          c.stib_points = id(cfg_stib_points).state;
          c.stib_lines = id(cfg_stib_lines).state;
          c.train_station = id(cfg_train_station).state;
          c.train_filter = id(cfg_train_filter).state;
          c.commute_from = id(cfg_commute_from).state;
          c.commute_to = id(cfg_commute_to).state;
          float la, lo;
          if (sscanf(id(cfg_location).state.c_str(), "%f,%f", &la, &lo) == 2 && la > 49 && la < 52 && lo > 2 && lo < 7) {
            c.lat = la; c.lon = lo;
          }
          c.weather_on = id(sw_weather).state;
          c.bealert_on = id(sw_bealert).state;
          c.disruptions_on = id(sw_disruptions).state;
          c.news_on = id(sw_news).state;
          diele::set_config(c);

          diele::Look &L = diele::look();
          auto lay = id(cfg_layout).active_index();
          L.layout = (diele::Layout) (lay.has_value() ? *lay : 0);
          L.ui_lang = LANGS[li.has_value() ? *li : 0];
          auto nm = id(cfg_night_mode).active_index();
          L.night = (diele::NightMode) (nm.has_value() ? *nm : 1);
          int h1, m1, h2, m2;
          if (sscanf(id(cfg_night).state.c_str(), "%d:%d-%d:%d", &h1, &m1, &h2, &m2) == 4) {
            L.night_from = h1 * 60 + m1; L.night_to = h2 * 60 + m2;
          }
          L.walk_min = (int) id(cfg_walk).state;
          L.walk_train_min = (int) id(cfg_walk_train).state;
          L.horizon_min = (int) id(cfg_horizon).state;
          L.dwell_s = (int) id(cfg_dwell).state;
          L.second = id(sw_second).state;
          L.status_bar = id(sw_status).state;
          L.pager = id(sw_pager).state;
          L.free_on = id(sw_free).state;
          L.free_text = id(cfg_free_text).state;
          L.aliases = id(cfg_aliases).state;
          L.points = id(cfg_stib_points).state;
          L.version++;
          diele::start();

          // Helligkeit: Nachtfenster -> "Helligkeit Nacht". Tagsüber mit Lichtsensor logarithmisch
          // zwischen "Helligkeit Nacht" (dunkel, <1 lx) und "Helligkeit" (hell, >=300 lx), geglättet.
          bool night = diele::in_night(L, id(sntp_time).now());
          float b_lo = id(cfg_brightness_night).state, b_hi = id(cfg_brightness).state;
          float target = night ? b_lo : b_hi;
          if (!night && id(sw_auto_bright).state && id(ambient_lux).has_state() && !std::isnan(id(ambient_lux).state)) {
            float lux = std::max(0.0f, id(ambient_lux).state);
            float k = std::min(1.0f, std::log10(lux + 1.0f) / std::log10(301.0f));
            target = b_lo + (b_hi - b_lo) * k;
          }
          static float smooth = -1;
          smooth = smooth < 0 ? target : smooth + (target - smooth) * 0.35f;
          static int last_b = -1;
          int b = (int) lroundf(smooth);
          if (abs(b - last_b) >= 2 || (last_b != b && (b <= 10 || night))) { id(matrix).set_brightness(b); last_b = b; }

# Einstellungen – am Gerät gespeichert (NVS). Single source of truth: Web-Einrichtung UND
# Home Assistant schreiben dieselben Entitäten (letzter Schreibzugriff gewinnt).
# Absichtlich leer als Default: KEINE Schlüssel/Haltestellen/Orte im öffentlichen Repo.

preferences:
  flash_write_interval: 5s   # Einstellungen schnell sichern (selten geändert)

# HA-Integration: Infokarten (Kalender, Auto-Pendelzeit, Freitext, Warnungen) ans Board schicken.
api:
  actions:
    - action: push_card
      variables:
        key: string     # gleiche key ersetzt die Karte; leere message löscht sie
        message: string
        tag: int        # 0 Kalender, 1 Pendeln, 2 Wetter, 3 Störung, 4 Warnung, 5 News, 6 HA
        prio: int       # 0 = Vollbild-Warnung, 1 hoch .. 3 niedrig
        ttl: int        # Sekunden, 0 = bis gelöscht
      then:
        - lambda: 'diele::push_card(key, message, tag, prio, ttl);'
    - action: clear_alert
      then:
        - lambda: 'diele::clear_ha_alert();'

# STIB-Schlüssel: nur schreibbar. Der Wert liegt in einer gesicherten Gerätevariablen; die
# Entität meldet nur "gesetzt"/"" -> der Schlüssel landet nie in HA-Verlauf/Recorder.
globals:
  - id: g_stib_key
    type: std::array<char, 65>
    restore_value: true
    initial_value: 'std::array<char, 65>{}'

text:
  - platform: template
    id: cfg_stib_key
    name: "STIB API-Schlüssel"
    icon: mdi:key
    mode: password
    max_length: 64
    entity_category: config
    update_interval: 60s
    lambda: 'return std::string(id(g_stib_key)[0] ? "gesetzt" : "");'
    set_action:
      - lambda: |-
          auto &k = id(g_stib_key);
          k.fill(0);
          strncpy(k.data(), x.c_str(), k.size() - 1);
          id(cfg_stib_key).publish_state(k[0] ? "gesetzt" : "");

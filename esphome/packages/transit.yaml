# Datenquellen laufen standalone in einem eigenen FreeRTOS-Task: ../perron/perron_core.h
#   STIB WaitingTimes (30 s) + TravellersInformation (10 min), iRail liveboard (60 s) +
#   connections (5 min), KMI getForecasts (15 min), BE-Alert CapGateway (5 min), News (30 min).
# http_request wird nur eingebunden, damit ESP-IDF das CA-Zertifikatsbündel (HTTPS) und
# ArduinoJson mitbaut; die Abrufe selbst nutzen esp_http_client direkt (Streaming in PSRAM).
http_request:
  verify_ssl: true
  useragent: "perron/0.4 (+https://github.com/Nosdave/perron)"

json:

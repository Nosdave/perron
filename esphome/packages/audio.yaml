# Audio (2× MAX98357A, I2S, mono): Testton und RTTTL-Melodien aus Home Assistant.
# Anschluss beider Verstärker parallel: LRC -> A1 (GPIO3), BCLK -> A2 (GPIO9), DIN -> A3 (GPIO10),
# SD -> A4 (GPIO11), GAIN frei, Vin/GND vom 5-V-Netzteil (+ GND-Brücke zur MatrixPortal).
# SD: LOW = Verstärker aus (Ruhe, kein Rauschen); losgelassen (open drain) = an, mono (L+R)/2 über
# den 1-MΩ-Widerstand der Platine. Nie aktiv HIGH treiben (3,3 V = nur linker Kanal).
output:
  - platform: gpio
    id: amp_sd
    pin:
      number: GPIO11
      mode:
        output: true
        open_drain: true

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO3
    i2s_bclk_pin: GPIO9

speaker:
  - platform: i2s_audio
    id: amp
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO10
    sample_rate: 16000
    channel: mono
    # 1 s Vorrat (PSRAM): der Tongenerator füllt nur zwischen zwei Anzeige-Durchläufen nach;
    # mit 100 ms entstanden Lücken (Ton "quakt")
    buffer_duration: 1000ms

rtttl:
  id: beeper
  speaker: amp
  gain: 0.5
  on_finished_playback:
    - delay: 200ms
    - output.turn_off: amp_sd

number:
  - platform: template
    id: cfg_tone_volume
    name: "Lautstärke Töne"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 50
    entity_category: config
    on_value:
      - lambda: 'id(beeper).set_gain(x / 100.0f);'
  # Treiberstärke LRC/BCLK/DIN: 0 = weichste Flanken (~5 mA) … 3 = härteste (~40 mA), 2 = ESP-Standard.
  # Zu weich -> Verstärker verliert den Takt (stumm); zu hart auf langen Jumperkabeln -> Kratzen.
  - platform: template
    id: cfg_amp_drive
    name: "Audio Treiberstärke"
    icon: mdi:sine-wave
    min_value: 0
    max_value: 3
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 2
    entity_category: config

button:
  - platform: template
    name: "Lautsprecher testen"
    icon: mdi:speaker
    entity_category: diagnostic
    on_press:
      - output.turn_on: amp_sd
      - delay: 50ms
      - rtttl.play: 'kammerton:d=2,o=4,b=60:a'   # 2 s, 440 Hz
      - script.execute: amp_soft_edges

# Home Assistant: beliebige RTTTL-Melodie, z. B. "gong:d=4,o=5,b=100:e6,c6"
api:
  actions:
    - action: ton_abspielen
      variables:
        melodie: string
      then:
        - output.turn_on: amp_sd
        - delay: 50ms
        - rtttl.play: !lambda 'return melodie;'
        - script.execute: amp_soft_edges

# Treiberstärke auf LRC/BCLK/DIN nach "Audio Treiberstärke": auf ungeschirmten Jumperkabeln schwingen
# steile Flanken über (Kratzen), zu weiche erreichen den Verstärker nicht mehr sauber (stumm).
# Der I2S-Treiber richtet die Pins bei jedem Start neu ein, deshalb kurz danach (erneut) setzen.
script:
  - id: amp_soft_edges
    mode: restart
    then:
      - delay: 20ms
      - lambda: |-
          auto cap = (gpio_drive_cap_t) (int) id(cfg_amp_drive).state;
          for (auto pin : {GPIO_NUM_3, GPIO_NUM_9, GPIO_NUM_10})
            gpio_set_drive_capability(pin, cap);

# Perron – ESPHome-Firmware (Hauptdatei)
# ======================================================
# STANDALONE-first: läuft komplett ohne Home Assistant.
#   - Erst-Einrichtung: kein WLAN gespeichert -> Hotspot "Perron" + QR-Code auf der Tafel
#     -> Handy verbindet sich -> Einrichtungsseite (captive portal) -> eigenes WLAN wählen.
#   - Einstellungen (STIB-Schlüssel, Haltestellen, Helligkeit): Webseite http://perron.local
#   - Updates: über WLAN (ESPHome/HA) bzw. später automatisch von GitHub.
#   - Home Assistant ist optional (Extras wie Waze/Präsenz); fällt HA aus, läuft die Tafel weiter.
#
# Diese Datei ist ÖFFENTLICH und enthält bewusst KEINE Secrets/Ortsdaten: WLAN, Schlüssel und
# Haltestellen werden zur Laufzeit am Gerät eingegeben und dort gespeichert.
# Doku: ../docs/03-esphome.md

substitutions:
  name: perron
  friendly_name: "Perron"
  setup_ssid: "Perron"   # kurz halten: steckt im Setup-QR-Code (muss auf 64 px passen)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: nosdave.perron
    version: "0.5.0"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          perron::groups_boot_blob() = std::string(id(g_groups).data());
          perron::groups_saver() = [](const std::string &blob) {
            auto &g = id(g_groups);
            g.fill(0);
            strncpy(g.data(), blob.c_str(), g.size() - 1);
          };
          // Bildkarten per URL (packages/cards.yaml)
          perron::url_loader() = [](uint8_t fmt, const std::string &url) {
            auto *img = fmt == 2 ? id(ha_jpg) : fmt ? id(ha_bmp) : id(ha_png);
            img->set_url(url);
            img->update();
          };
  includes:
    - perron/perron_core.h
    - perron/perron_icons.h
    - perron/perron_lines.h
    - perron/perron_cards.h
    - perron/perron_render.h
    - perron/perron_cards_draw.h

esp32:
  board: adafruit_matrixportal_esp32s3   # verifiziert 18.10. (ESPHome 2026.5)
  framework:
    type: esp-idf
    advanced:
      # Volles CA-Bündel: das Standard-"common"-Bündel kennt die CA von app.meteo.be (KMI) nicht.
      use_full_certificate_bundle: true
    sdkconfig_options:
      # TLS-Puffer/RSA-Rechnungen in PSRAM: der interne RAM ist durch die HUB75-DMA-Puffer
      # (double_buffer) knapp -> sonst MBEDTLS_ERR_MPI_ALLOC_FAILED beim Zertifikatscheck.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      # malloc() > 4 KB automatically from PSRAM: keeps internal RAM free for DMA/TLS sockets
      # (the RMI chain failed with ~35 KB internal heap left).
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

# MatrixPortal S3 = ESP32-S3 N8R2 -> 2 MB Quad-PSRAM.
psram:
  mode: quad

logger:

# Für HA (optional). Ohne Schlüssel, damit dieselbe Firmware für jeden funktioniert;
# beim Übernehmen in HA/ESPHome kann man einen eigenen Schlüssel setzen.
api:
  reboot_timeout: 0s   # Default 15 min -> ohne HA würde das Board ständig neu starten!
  # Verschlüsselung ohne festen Schlüssel: Home Assistant überträgt beim Einbinden einen
  # eigenen Schlüssel, die Tafel speichert ihn und spricht danach nur noch verschlüsselt.
  # So bleibt die öffentliche Firmware frei von Geheimnissen.
  encryption: {}

ota:
  - platform: esphome
  - platform: http_request   # Updates direkt von GitHub Pages (ohne HA)

# Firmware-Updates: Manifest auf GitHub Pages des öffentlichen Verteil-Repos Nosdave/perron.
# Prüft alle 6 h; installiert automatisch nur nachts (03-05 Uhr), abschaltbar.
update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: https://nosdave.github.io/perron/firmware/manifest.json
    update_interval: 6h

# Update-Prüfung auch kurz nach dem Start (nicht erst nach 6 h) – sobald WLAN und Uhrzeit stehen.
interval:
  - interval: 60s
    startup_delay: 90s
    then:
      - lambda: |-
          static bool done = false;
          if (done || !wifi::global_wifi_component->is_connected() || !id(sntp_time).now().is_valid()) return;
          done = true;
          id(fw_update).update();

wifi:
  # Keine Zugangsdaten hier: werden über Hotspot/Captive-Portal (oder USB/Improv) eingegeben
  # und bleiben bei Updates über WLAN erhalten.
  ap:
    ssid: ${setup_ssid}   # offen, nur aktiv solange kein WLAN verbunden ist
  reboot_timeout: 0s      # Default 15 min -> bei WLAN-Ausfall NICHT neu starten

captive_portal:

improv_serial:   # WLAN auch per USB einrichtbar (z. B. web.esphome.io)

web_server:
  version: 3
  # Eigene Einrichtungs-Oberfläche (web/setup.js) statt der ESPHome-Standardseite; komplett in
  # der Firmware, kein CDN -> funktioniert auch ohne Internet.
  js_url: ""
  js_include: web/setup.js
  css_include: web/setup.css
  ota: false     # kein Firmware-Upload über die (offene) Webseite

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Brussels

packages:
  settings:   !include packages/settings.yaml
  display:    !include packages/display.yaml
  transit:    !include packages/transit.yaml
  light:      !include packages/light.yaml
  cards:      !include packages/cards.yaml

# Diagnose
sensor:
  - platform: template
    id: wx_temp
    name: "Temperatur (KMI)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      auto &f = perron::frame();
      if (!f.m.wx.valid) return NAN;
      return (float) f.m.wx.temp;
  - platform: debug
    free:
      name: "Heap frei"
      entity_category: diagnostic
    block:
      name: "Heap größter Block"
      entity_category: diagnostic
    psram:
      name: "PSRAM frei"
      entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: "Neustart-Grund"
      entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP-Adresse"
      entity_category: diagnostic
  - platform: template
    id: data_status
    name: "Datenstatus"
    icon: mdi:database-clock
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      auto m = perron::snapshot();
      uint32_t now = perron::now_epoch();
      std::string out;
      for (int i = 0; i < perron::SRC_N; i++) {
        if (!m.ts[i] && m.err[i].empty()) continue;
        char b[96];
        uint32_t a = (m.ts[i] && now >= m.ts[i]) ? now - m.ts[i] : 0;
        snprintf(b, sizeof(b), "%s%s: %s%s", out.empty() ? "" : " | ", perron::SRC_NAME[i],
                 m.ts[i] ? (a < 120 ? (std::to_string(a) + "s").c_str() : (std::to_string(a / 60) + "m").c_str()) : "-",
                 m.err[i].empty() ? "" : (" ! " + m.err[i]).c_str());
        out += b;
      }
      char t[64];
      snprintf(t, sizeof(t), " | Abfahrten %u+%u | Stack %u", (unsigned) m.deps.size(), (unsigned) m.trains.size(),
               (unsigned) m.stack_free);
      return out.empty() ? std::string("warte auf Daten") : out + t;

  # Abfahrten für Home Assistant (Sprachassistent, Automationen): die Tafel ist der einzige
  # STIB-Abrufer im Haus -> HA liest hier statt selbst zu pollen (API-Limit pro Schlüssel).
  # JSON: [{"l":"81","d":"Montgomery","m":[6,15]},...]  (max. 255 Zeichen)
  - platform: template
    id: departures_json
    name: "Abfahrten"
    icon: mdi:bus-clock
    update_interval: 30s
    # [{"l":"81","p":"1234","d":"Montgomery","m":[2,18]},{"l":"71","p":"2345","d":"Delta","m":[],"t":"05:42"}]
    # l = line, p = STIB platform (pointid, absent for trains), d = destination of the next vehicle
    # m = Minuten bis zur Abfahrt an der Haltestelle (erreichbare, innerhalb der Vorschau);
    # t = Uhrzeit der nächsten Abfahrt, wenn sie außerhalb der Vorschau liegt.
    lambda: |-
      auto &rows = perron::frame().rows;
      std::string o = "[";
      for (size_t i = 0; i < rows.size(); i++) {
        std::string e = std::string(i ? "," : "") + "{\"l\":\"" + rows[i].line + "\"";
        if (!rows[i].point.empty()) e += ",\"p\":\"" + rows[i].point + "\"";
        e += ",\"d\":\"" + rows[i].dest + "\",\"m\":[";
        for (size_t k = 0; k < rows[i].mins.size(); k++) e += (k ? "," : "") + std::to_string(rows[i].mins[k]);
        e += "]";
        if (rows[i].mins.empty() && rows[i].next_epoch) e += ",\"t\":\"" + perron::hhmm(rows[i].next_epoch) + "\"";
        e += "}";
        if (o.size() + e.size() + 1 > 255) break;
        o += e;
      }
      return o + "]";
  - platform: template
    id: wx_text
    name: "Wetter (KMI)"
    icon: mdi:weather-partly-cloudy
    update_interval: 60s
    # "partlycloudy 12° (8/15) | Regen ab 22:40 bis 23:30" – Wetterlage, Temperatur, Min/Max, Radar
    lambda: |-
      auto &w = perron::frame().m.wx;
      if (!w.valid) return std::string("");
      char b[160];
      snprintf(b, sizeof(b), "%s %d° (%d/%d)", perron::ww_condition(w.ww, w.night), w.temp, w.tmin, w.tmax);
      std::string o = b;
      if (w.rain_start) {
        o += std::string(" | Regen ") + (w.raining_now ? "jetzt" : "ab " + perron::hhmm(w.rain_start));
        if (w.rain_end) o += " bis " + perron::hhmm(w.rain_end);
      }
      if (w.warning_level) o += " | Warnung " + std::to_string(w.warning_level) + ": " + w.warning;
      return o;
  - platform: template
    id: next_departure
    name: "Nächste Abfahrt"
    icon: mdi:clock-fast
    update_interval: 30s
    lambda: |-
      const perron::Row *best = nullptr;
      for (auto &r : perron::frame().rows)
        if (!r.mins.empty() && (!best || r.mins[0] < best->mins[0])) best = &r;
      if (!best) return std::string("");
      return best->line + " " + best->dest + " " + std::to_string(best->mins[0]) + " min";

debug:
  update_interval: 60s

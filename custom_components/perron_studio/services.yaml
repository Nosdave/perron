show:
  fields:
    tile:
      required: true
      example: "Energie"
      selector:
        text:
    zone:
      example: "f"
      selector:
        select:
          options:
            - label: "Vollbild"
              value: "f"
            - label: "Kachel rechts"
              value: "p"
            - label: "Infozeile"
              value: "l"
    duration:
      example: 20
      selector:
        number:
          min: 3
          max: 3600
          unit_of_measurement: s
hide:
  fields:
    tile:
      required: true
      example: "Energie"
      selector:
        text:
show_commute:
  fields:
    slot:
      required: true
      example: 1
      selector:
        select:
          options:
            - "1"
            - "2"
    duration:
      example: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: s
play_video:
  fields:
    source:
      required: true
      example: "camera.wohnungstur"
      selector:
        text:
    layout:
      default: "f"
      selector:
        select:
          options:
            - label: "Vollbild (randlos)"
              value: "f"
            - label: "Mit Statusleiste und Infozeile"
              value: "b"
            - label: "Video links, Text rechts"
              value: "s"
            - label: "Kachel rechts, Abfahrten bleiben"
              value: "p"
    title:
      example: "Volt · Wetter"
      selector:
        text:
    text:
      example: "Morgen 14°, ab 12 Uhr leichter Regen"
      selector:
        text:
    duration:
      default: 30
      selector:
        number:
          min: 1
          max: 900
          unit_of_measurement: s
    fps:
      default: 12
      selector:
        number:
          min: 1
          max: 20
    loop:
      default: false
      selector:
        boolean:
stop_video:

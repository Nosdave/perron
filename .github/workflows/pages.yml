# Builds the firmware and publishes it together with the GPS setup helper on GitHub Pages:
#   https://nosdave.github.io/perron/setup/                  setup helper (https -> geolocation)
#   https://nosdave.github.io/perron/data/                   stop/station data (from GTFS)
#   https://nosdave.github.io/perron/firmware/manifest.json  OTA manifest (checked by devices every 6 h)
name: Firmware + Pages

on:
  push:
    branches: [main]
    paths: ["esphome/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome/perron.yaml
          version: 2026.5.3
          complete-manifest: true
          release-summary: "Perron firmware"
          release-url: "https://github.com/${{ github.repository }}/commits/${{ github.sha }}"
      - name: Assemble site
        run: |
          mkdir -p _site/firmware
          cp -r site/* _site/
          cp -r "${{ steps.esphome.outputs.name }}"/* _site/firmware/
          ls -la _site/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
